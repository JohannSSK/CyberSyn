services:
  cybersyn:
    build:
      context: .
      dockerfile: Dockerfile
    image: cybersyn:2026
    container_name: cybersyn
    restart: unless-stopped

    ports:
      - "5000:5000"

    environment:
      # Bind on every interface so the port is reachable from outside the container.
      CYBERSYN_HOST: "0.0.0.0"
      CYBERSYN_PORT: "5000"
      # Keep the Werkzeug debugger off. Set to 1 only for local development.
      CYBERSYN_DEBUG: "0"
      CYBERSYN_SCANNER_FALLBACK: "0"
      CYBERSYN_THREADS: "${CYBERSYN_THREADS:-8}"
      CYBERSYN_LOG_PROMPT_PREVIEW: "${CYBERSYN_LOG_PROMPT_PREVIEW:-0}"
      CYBERSYN_KEY_FILE: /app/secrets/secret.key
      CYBERSYN_ADMIN_SIGNUP_TOKEN: "${CYBERSYN_ADMIN_SIGNUP_TOKEN:-}"
      CYBERSYN_ALLOW_PRIVATE_BASE: "${CYBERSYN_ALLOW_PRIVATE_BASE:-1}"
      CYBERSYN_COOKIE_SECURE: "${CYBERSYN_COOKIE_SECURE:-0}"
      # Optional: supply a Fernet key to decrypt API keys from another machine
      # (e.g. from your .env file). Leave empty to let CyberSyn generate one.
      CYBERSYN_KEY: "${CYBERSYN_KEY:-}"

    volumes:
      # Store the database and its encryption key in separate backups.
      - cybersyn-data:/app/src/backend
      - cybersyn-secrets:/app/secrets

volumes:
  cybersyn-data:
  cybersyn-secrets:
