<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#1c1917">
    <meta name="description" content="CyberSyn — every AI message checked on your machine first.">
    <title>{% block title %}CyberSyn{% endblock %}</title>

    <link rel="icon" href="/assets/icons/shield.svg" type="image/svg+xml">
    <link rel="icon" href="/assets/icons/shield.png" type="image/png">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
    {# Shared chrome: the sidebar is on every signed-in page, so it loads
       everywhere rather than from the one page that happens to need it. #}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/sidebar.css') }}">
    {% block styles %}{% endblock %}
</head>
<body data-routes='{{ api_routes | tojson }}' data-screen-budget="{{ screen_budget | default(45, true) }}"
      data-ai-timeout="{{ ai_timeout | default(60, true) }}"
      data-request-timeout="{{ request_timeout | default(135, true) }}">
    <div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>

    {% block body %}{% endblock %}

    <!-- Core, in dependency order: dom -> stages -> icons -> i18n -> api -> loading -> markdown -> shell -->
    <script src="{{ url_for('static', filename='js/core/dom.js') }}"></script>
    <script src="{{ url_for('static', filename='js/core/stages.js') }}"></script>
    <script src="{{ url_for('static', filename='js/core/icons.js') }}"></script>
    <script src="{{ url_for('static', filename='js/core/i18n.js') }}"></script>
    <script src="{{ url_for('static', filename='js/core/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/core/loading.js') }}"></script>
    <script src="{{ url_for('static', filename='js/core/markdown.js') }}"></script>
    <script src="{{ url_for('static', filename='js/core/shell.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
