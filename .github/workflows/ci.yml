name: CI

# Run on every push and every pull request that targets main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Cache the pip download cache between runs (keyed on this file, so the
      # cache is rebuilt when the install line changes).
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-ci-pip-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-ci-pip-

      # NOTE: the full requirements.txt is intentionally NOT installed here.
      # It pulls in PyTorch, transformers, spaCy, RapidOCR/ONNXRuntime and the
      # scanner weights, which is far too heavy for a CI job and needs network
      # access. The offline suites below only import the web layer, so we
      # install just those packages. pytest is not in requirements.txt; it also
      # collects the project's unittest TestCase suites.
      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flask==3.1.3 werkzeug==3.1.6 cryptography==46.0.7 pytest

      # No API keys and no calls to external AI providers: the suites stub the
      # scanners and the provider client and use a throwaway SQLite database.
      # Model-heavy suites are excluded because they load the ML weights:
      # test_screening, test_mls, test_ocr, test_native_restart, test_launchers.
      - name: Run offline tests
        env:
          CYBERSYN_DB_FILE: ${{ runner.temp }}/cybersyn-ci.db
          CYBERSYN_KEY_FILE: ${{ runner.temp }}/cybersyn-ci.key
          CYBERSYN_WARM_MODELS: '0'
          HF_HUB_OFFLINE: '1'
        run: >
          python -m pytest -q
          tools/test_auth.py
          tools/test_constants.py
          tools/test_gateway.py
          tools/test_model_cache.py
          tools/test_models.py
          tools/test_providers.py
          tools/test_provider_errors.py
          tools/test_scanner_rules.py
          tools/test_shadow_policy.py
