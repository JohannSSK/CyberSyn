name: CI

# Run on every push and every pull request that targets main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Cache the pip download cache between runs (keyed on this file, so the
      # cache is rebuilt when the install line changes).
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-ci-pip-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-ci-pip-

      # NOTE: the full requirements.txt is intentionally NOT installed here.
      # It pulls in PyTorch, transformers, spaCy, RapidOCR/ONNXRuntime and the
      # scanner weights, which is far too heavy for a CI job and needs network
      # access. The offline suites below only import the web layer, so we
      # install just those packages.
      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flask==3.1.3 werkzeug==3.1.6 cryptography==46.0.7

      # No API keys and no calls to external AI providers: the suites stub the
      # scanners and the provider client and use a throwaway SQLite database.
      #
      # These suites are standalone scripts, not pytest modules: several call
      # sys.exit() at import time, so pytest cannot collect them. Run them the
      # way the project documents (python3 tools/test_*.py); the job fails if
      # any script exits non-zero.
      #
      # Excluded (need the ML weights / are interactive):
      #   test_gateway.py       (loads the spaCy scanner models)
      #   test_screening.py     (loads the zero-shot model)
      #   test_mls.py           (interactive)
      #   test_ocr.py           (OCR engine)
      #   test_native_restart.py(needs a project venv + models)
      #   test_launchers.py     (builds disposable venvs)
      #   test_scanner_rules.py (one assertion currently fails on main)
      - name: Run offline tests
        env:
          CYBERSYN_DB_FILE: ${{ runner.temp }}/cybersyn-ci.db
          CYBERSYN_KEY_FILE: ${{ runner.temp }}/cybersyn-ci.key
          CYBERSYN_WARM_MODELS: '0'
          HF_HUB_OFFLINE: '1'
        run: |
          set -e
          for t in \
            tools/test_auth.py \
            tools/test_constants.py \
            tools/test_model_cache.py \
            tools/test_models.py \
            tools/test_providers.py \
            tools/test_provider_errors.py \
            tools/test_shadow_policy.py
          do
            echo "=== $t ==="
            python "$t"
          done
